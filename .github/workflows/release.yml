name: Release

# Build unsigned macOS arm64 (.dmg) and Windows x64 (.msi/.exe) installers,
# attach them to a public GitHub Release. Trigger by pushing a `v*` tag, e.g.:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# UNSIGNED — first-launch UX:
#   - macOS: ad-hoc signed (signingIdentity: "-" in tauri.conf.json) but not
#     notarized, so first launch shows "Apple could not verify ... is free of
#     malware". Click "Done", then System Settings → Privacy & Security →
#     "Open Anyway". Without ad-hoc signing on Apple Silicon, Gatekeeper would
#     refuse outright with "app is damaged" (no override available).
#   - Windows: SmartScreen will show "Windows protected your PC" → "More info"
#     → "Run anyway".
# Once we have an Apple Developer ID + Windows code-signing cert, fill in the
# signing block at the bottom of this file and the experience cleans up.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to package (for example v0.1.3)"
        required: true
        type: string
      build_only:
        description: "Validate the selected workflow branch without creating a release"
        type: boolean
        default: false

jobs:
  publish-tauri:
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    permissions:
      contents: write
    strategy:
      # Keep successful installers in a draft until both platforms are verified.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # GitHub-hosted macOS runners are arm64.
            rust_target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: windows-2022      # Pin the Windows SDK/MSVC image used for releases.
            rust_target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_only && github.ref || env.RELEASE_TAG }}

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Run frontend tests
        run: pnpm test

      - name: Test release scripts
        run: node --test .github/scripts/prepare-release.test.mjs .github/scripts/release-tauri.test.mjs

      - name: Verify release version
        run: pnpm check:release-version

      - name: Run Rust tests
        run: cd src-tauri && cargo test --no-default-features

      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && hashFiles('.github/scripts/import-windows-certificate.ps1') != ''
        shell: pwsh
        run: .github/scripts/import-windows-certificate.ps1

      - name: Prepare signing and updater configuration
        id: release-config
        if: hashFiles('.github/scripts/prepare-release.mjs') != ''
        run: node .github/scripts/prepare-release.mjs

      - name: Validate installer build
        if: inputs.build_only
        run: node .github/scripts/release-tauri.mjs build ${{ matrix.args }} --config "${{ steps.release-config.outputs.config }}"

      - uses: tauri-apps/tauri-action@v0
        if: ${{ !inputs.build_only }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: node .github/scripts/release-tauri.mjs
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "rdbstudio ${{ env.RELEASE_TAG }}"
          releaseBody: |
            ## rdbstudio ${{ env.RELEASE_TAG }}

            macOS signing: ${{ env.APPLE_CERTIFICATE != '' && 'configured' || 'not configured' }}.
            Windows signing: ${{ env.WINDOWS_CERTIFICATE != '' && 'configured' || 'not configured' }}.
            Signed automatic-update artifacts: ${{ steps.release-config.outputs.updater == 'true' && 'enabled' || 'not configured' }}.

            If platform signing is not configured, macOS may require System Settings →
            Privacy & Security → Open Anyway; Windows may show SmartScreen.

            See [CHANGELOG.md](https://github.com/luckylee6666/rdbstudio/blob/${{ env.RELEASE_TAG }}/CHANGELOG.md).
          releaseDraft: true
          # Auto-detect pre-releases by tag suffix so v0.1.0-rc.1 doesn't get
          # marked as a stable release. Add more markers (-pre, -dev, ...) here
          # if we adopt them.
          prerelease: ${{ contains(env.RELEASE_TAG, '-rc') || contains(env.RELEASE_TAG, '-beta') || contains(env.RELEASE_TAG, '-alpha') }}
          args: ${{ matrix.args }} ${{ steps.release-config.outputs.config != '' && format('--config "{0}"', steps.release-config.outputs.config) || '' }}
