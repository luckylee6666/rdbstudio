name: Release

# Build unsigned macOS arm64 (.dmg) and Windows x64 (.msi/.exe) installers,
# attach them to a draft GitHub Release. Trigger by pushing a `v*` tag, e.g.:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# UNSIGNED — first-launch UX:
#   - macOS: ad-hoc signed (signingIdentity: "-" in tauri.conf.json) but not
#     notarized, so first launch shows "Apple could not verify ... is free of
#     malware". Click "Done", then System Settings → Privacy & Security →
#     "Open Anyway". Without ad-hoc signing on Apple Silicon, Gatekeeper would
#     refuse outright with "app is damaged" (no override available).
#   - Windows: SmartScreen will show "Windows protected your PC" → "More info"
#     → "Run anyway".
# Once we have an Apple Developer ID + Windows code-signing cert, fill in the
# signing block at the bottom of this file and the experience cleans up.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to package (for example v0.1.3)"
        required: true
        type: string

jobs:
  publish-tauri:
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    permissions:
      contents: write
    strategy:
      # Don't cancel the other build if one platform fails — we still want
      # whichever installer succeeded to make it into the draft release.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # GitHub-hosted macOS runners are arm64.
            rust_target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest    # x64 by default.
            rust_target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Run frontend tests
        run: pnpm test

      - name: Verify release version
        run: pnpm check:release-version

      - name: Run Rust tests
        run: cd src-tauri && cargo test --no-default-features

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ─── Signing (commented until certificates are available) ──────────
          # macOS Developer ID + notarization:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code-signing:
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Tauri updater signing (run `pnpm tauri signer generate` first):
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "rdbstudio ${{ env.RELEASE_TAG }}"
          releaseBody: |
            ## rdbstudio ${{ env.RELEASE_TAG }}

            > **Unsigned build** — first launch needs an extra step:
            > - **macOS (arm64)**: 双击会提示"无法验证…是否包含恶意软件" →
            >   点 **完成** → **系统设置 → 隐私与安全性** → 滚到底部，
            >   "已阻止使用 rdbstudio" 旁点 **仍要打开** → 再次双击即可。
            >   （app 已做 ad-hoc 签名，**不会**出现"已损坏"。）
            > - **Windows (x64)**: SmartScreen → "More info" → "Run anyway".
            > Signed + notarized builds will land once code-signing certificates are in place.

            See [CHANGELOG.md](https://github.com/luckylee6666/rdbstudio/blob/main/CHANGELOG.md).
          releaseDraft: true
          # Auto-detect pre-releases by tag suffix so v0.1.0-rc.1 doesn't get
          # marked as a stable release. Add more markers (-pre, -dev, ...) here
          # if we adopt them.
          prerelease: ${{ contains(env.RELEASE_TAG, '-rc') || contains(env.RELEASE_TAG, '-beta') || contains(env.RELEASE_TAG, '-alpha') }}
          args: ${{ matrix.args }}
