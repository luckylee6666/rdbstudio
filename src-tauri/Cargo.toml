[package]
name = "rdbstudio"
version = "0.1.6"
description = "Modern cross-platform database GUI"
edition = "2021"
rust-version = "1.88"

[lib]
name = "rdbstudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "windows-native"] }
sqlx = { version = "=0.8.6", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "postgres",
    "mysql",
    "chrono",
    "uuid",
    "json",
    "rust_decimal",
] }
futures = "0.3"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
csv = "1.3"
quick-xml = "0.38"
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "script"] }
tempfile = "3"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
calamine = { version = "0.36", features = ["chrono"] }
base64 = "0.22"
libsqlite3-sys = "=0.30.1"
zip = { version = "8", default-features = false, features = ["deflate"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Dev-only HTTP bridge for driving the UI from a browser; see docs/web-bridge.md.
web-bridge = ["tauri/test"]

[[example]]
name = "web_bridge"
required-features = ["web-bridge"]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["full", "test-util", "macros"] }
